# Continuous integration (no Docker): lint, type-check, test and migration check.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (locked versions on 3.13, latest compatible elsewhere)
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            pip install -c constraints.txt -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi
      - name: Lint
        run: |
          ruff check src tests migrations scripts
          ruff format --check src tests migrations scripts
      - name: Type-check
        run: mypy
      - name: Tests
        run: pytest -q --cov=flexdrop --cov-report=term
