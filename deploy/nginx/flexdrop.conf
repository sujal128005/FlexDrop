# nginx reverse proxy for FlexDrop (TLS termination, request IDs, coarse rate limiting)
limit_req_zone $binary_remote_addr zone=flexdrop_per_ip:10m rate=50r/s;

upstream flexdrop_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name flexdrop.internal.example;

    ssl_certificate     /etc/ssl/flexdrop/fullchain.pem;
    ssl_certificate_key /etc/ssl/flexdrop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    proxy_read_timeout 30s;

    location /metrics/prometheus {
        allow 10.0.0.0/8;          # monitoring network only
        deny all;
        proxy_pass http://flexdrop_api;
    }

    location / {
        limit_req zone=flexdrop_per_ip burst=100 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://flexdrop_api;
    }
}

server {
    listen 80;
    server_name flexdrop.internal.example;
    return 301 https://$host$request_uri;
}
